name: Release & Publish Docker

on:
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'

      - name: Install semantic-release
        run: |
          npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release

      - name: Get latest tag
        id: get_tag
        run: |
          echo "tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/structura-lens
          TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          docker build -t ${IMAGE_NAME}:${TAG} -t ${IMAGE_NAME}:latest -f Dockerfile .
          docker push ${IMAGE_NAME}:${TAG}
          docker push ${IMAGE_NAME}:latest

      - name: Annotate GitHub Release with image info
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.TAG;
            const image = `${process.env.IMAGE_NAME}:${tag}`;
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            }).catch(() => null);
            if (release) {
              const body = (release.data.body || '') + `\n\nDocker image: ${image}`;
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                body
              });
            }
        env:
          TAG: ${{ steps.get_tag.outputs.tag }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/structura-lens