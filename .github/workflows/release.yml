name: Release & Publish Binaries

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-platform binaries
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          VERSION: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          echo "Building binaries for version: ${VERSION}"
          
          # Build for each platform
          dotnet publish src/StructuraLens.Cli/StructuraLens.Cli.csproj \
            -c Release \
            -r linux-arm64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o ./publish/linux-arm64

          dotnet publish src/StructuraLens.Cli/StructuraLens.Cli.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o ./publish/linux-x64

          dotnet publish src/StructuraLens.Cli/StructuraLens.Cli.csproj \
            -c Release \
            -r osx-arm64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o ./publish/osx-arm64


          dotnet publish src/StructuraLens.Cli/StructuraLens.Cli.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o ./publish/win-x64

          # Create release archives
          echo "Creating release archives..."
          mkdir -p artifacts
          
          cd publish/linux-arm64
          tar -czf ../../artifacts/structuralens-linux-arm64-${VERSION}.tar.gz StructuraLens.Cli
          cd ../linux-x64
          tar -czf ../../artifacts/structuralens-linux-x64-${VERSION}.tar.gz StructuraLens.Cli
          cd ../osx-arm64
          tar -czf ../../artifacts/structuralens-macos-arm64-${VERSION}.tar.gz StructuraLens.Cli
          cd ../win-x64
          zip ../../artifacts/structuralens-windows-x64-${VERSION}.zip StructuraLens.Cli.exe
          cd ../..

          echo "Build complete! Artifacts:"
          ls -lh artifacts/

      - name: Upload release assets
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.semantic.outputs.new_release_version }}
        run: |
          echo "Uploading release assets to ${TAG}"
          gh release upload ${TAG} artifacts/*.tar.gz artifacts/*.zip
