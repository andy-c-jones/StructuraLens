name: Release & Publish Docker

on:
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install semantic-release
        run: |
          npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npx semantic-release

  docker:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/structura-lens
        run: |
          # semantic-release creates a git tag like v1.2.3; use it as image tag
          TAG=$(git describe --tags --abbrev=0)
          docker build -t ${IMAGE_NAME}:${TAG} -t ${IMAGE_NAME}:latest -f Dockerfile .
          docker push ${IMAGE_NAME}:${TAG}
          docker push ${IMAGE_NAME}:latest