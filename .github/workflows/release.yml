name: Release & Publish Binaries

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-platform binaries
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          VERSION: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          echo "Building binaries for version ${VERSION} for all platforms..."
          
          # Build for each platform with version injected
          dotnet publish src/StructuraLens.Cli/StructuraLens.Cli.csproj \
            -c Release \
            -r linux-arm64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:Version=${VERSION} \
            -p:AssemblyVersion=${VERSION} \
            -p:InformationalVersion=${VERSION} \
            -o ./publish/linux-arm64

          dotnet publish src/StructuraLens.Cli/StructuraLens.Cli.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:Version=${VERSION} \
            -p:AssemblyVersion=${VERSION} \
            -p:InformationalVersion=${VERSION} \
            -o ./publish/linux-x64

          dotnet publish src/StructuraLens.Cli/StructuraLens.Cli.csproj \
            -c Release \
            -r osx-arm64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:Version=${VERSION} \
            -p:AssemblyVersion=${VERSION} \
            -p:InformationalVersion=${VERSION} \
            -o ./publish/osx-arm64

          dotnet publish src/StructuraLens.Cli/StructuraLens.Cli.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:Version=${VERSION} \
            -p:AssemblyVersion=${VERSION} \
            -p:InformationalVersion=${VERSION} \
            -o ./publish/win-x64

          echo "All platform builds completed successfully for version ${VERSION}!"

      - name: Create versioned release archives
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          VERSION: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          echo "Creating versioned release archives for version ${VERSION}..."
          mkdir -p artifacts
          
          cd publish/linux-arm64
          tar -czf ../../artifacts/structuralens-linux-arm64-${VERSION}.tar.gz StructuraLens.Cli LICENSE.md
          cd ../linux-x64
          tar -czf ../../artifacts/structuralens-linux-x64-${VERSION}.tar.gz StructuraLens.Cli LICENSE.md
          cd ../osx-arm64
          tar -czf ../../artifacts/structuralens-macos-arm64-${VERSION}.tar.gz StructuraLens.Cli LICENSE.md
          cd ../win-x64
          zip ../../artifacts/structuralens-windows-x64-${VERSION}.zip StructuraLens.Cli.exe LICENSE.md
          cd ../..

          echo "Versioned archives created! Artifacts:"
          ls -lh artifacts/

      - name: Upload release assets
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.semantic.outputs.new_release_version }}
        run: |
          echo "Uploading release assets to ${TAG}"
          gh release upload ${TAG} artifacts/*.tar.gz artifacts/*.zip
