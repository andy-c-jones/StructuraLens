name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/dependabot.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/dependabot.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Upload build artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            src/StructuraLens.Cli/bin/Release/
            src/StructuraLens.Core/bin/Release/
          retention-days: 1

  cli-verification:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: check-changes
        run: |
          git fetch origin ${{ github.base_ref }}
          
          # Get changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          
          # Check if code files changed (src/, tests/, web/, or relevant CI files)
          if echo "$CHANGED_FILES" | grep -qE '(^src/|^tests/|^web/|\.cs$|\.csproj$|\.sln$|\.slnx$|\.github/workflows/ci\.yml$|\.github/actions/analyze/)'; then
            echo "code_changed=true" >> $GITHUB_OUTPUT
            echo "Code changes detected"
          else
            echo "code_changed=false" >> $GITHUB_OUTPUT
            echo "No code changes detected (docs/config only)"
          fi

      - name: Setup .NET
        if: steps.check-changes.outputs.code_changed == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download build artifacts
        if: steps.check-changes.outputs.code_changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .

      - name: Publish self-contained (linux-x64)
        if: steps.check-changes.outputs.code_changed == 'true'
        run: |
          dotnet publish src/StructuraLens.Cli/StructuraLens.Cli.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -o ./artifacts/publish/linux-x64

      - name: Run StructuraLens CLI test
        if: steps.check-changes.outputs.code_changed == 'true'
        uses: ./.github/actions/analyze
        with:
          solution: 'StructuraLens.slnx'
          format: 'html'
          output: 'structuralens-report.html'
          executable-path: './artifacts/publish/linux-x64/StructuraLens.Cli'

      - name: Upload analysis report
        if: steps.check-changes.outputs.code_changed == 'true'
        uses: actions/upload-artifact@v7
        id: upload-report
        with:
          name: structuralens-report
          path: structuralens-report.html

      - name: Comment on PR
        if: steps.check-changes.outputs.code_changed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const artifactUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload-report.outputs.artifact-id }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `📊 StructuraLens CLI test completed. HTML report generated as verification. Download [here](${artifactUrl}).`
            });
