name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Publish self-contained (linux-x64)
        run: |
          dotnet publish src/StructuraLens.Cli/StructuraLens.Cli.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -o ./artifacts/publish/linux-x64

      - name: Run StructuraLens analysis
        if: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/analyze
        with:
          solution: 'StructuraLens.slnx'
          format: 'html'
          output: 'structuralens-report.html'
          executable-path: './artifacts/publish/linux-x64/StructuraLens.Cli'

      - name: Upload analysis report
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        id: upload-report
        with:
          name: structuralens-report
          path: structuralens-report.html

      - name: Comment on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload-report.outputs.artifact-id }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `📊 Analysis complete. Report available [here](${artifactUrl}).`
            });
