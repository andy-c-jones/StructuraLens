name: Performance Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.cs"
      - "**/*.sql"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.ts"
      - "**/*.tsx"
      - ".github/workflows/performance-review.yml"

permissions:
  contents: read
  pull-requests: write
  models: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Run Copilot performance reviewer
        uses: andy-c-jones/copilot-performance@v1.2.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip: dist,web/dist
