name: StructuraLens
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: andy-c-jones/StructuraLensAction@v1
        with:
          solution: StructuraLens.slnx
          github-token: ${{ secrets.GITHUB_TOKEN }}
