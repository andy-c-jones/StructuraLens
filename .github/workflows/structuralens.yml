name: StructuraLens
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.slnx'
      - '.github/workflows/structuralens.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: andy-c-jones/StructuraLensAction@v1
        with:
          solution: StructuraLens.slnx
          github-token: ${{ github.token }}

