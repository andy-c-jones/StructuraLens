name: 'StructuraLens Analyze'
description: 'Run StructuraLens analysis using native executable'

inputs:
  solution:
    description: 'Path to solution file (.sln/.slnx) or project (.csproj)'
    required: true
  format:
    description: 'Output format: json, compact, html, summary'
    required: false
    default: 'html'
  output:
    description: 'Output file path'
    required: false
    default: 'structuralens-report.html'
  executable-path:
    description: 'Path to StructuraLens executable'
    required: false
    default: './artifacts/publish/linux-x64/StructuraLens.Cli'

outputs:
  report-path:
    description: 'Path to the generated report'
    value: ${{ inputs.output }}

runs:
  using: 'composite'
  steps:
    - name: Run StructuraLens analysis
      shell: bash
      run: |
        chmod +x "${{ inputs.executable-path }}"
        "${{ inputs.executable-path }}" analyze "${{ inputs.solution }}" \
          --format ${{ inputs.format }} \
          --out "${{ inputs.output }}"
